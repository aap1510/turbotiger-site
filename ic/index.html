  <main class="ic-gate" id="icLoadingPanel" aria-live="polite">
    <img class="ic-gate__brand" src="../assets/icone-turbotiger-raio.webp" alt="">
    <div class="ic-spinner" aria-hidden="true"></div>
    <h1>Inteligência de Cassino</h1>
    <p>Preparando seu ambiente de controle.</p>
  </main>

  <main class="ic-gate" id="icAccessPanel" hidden>
    <div class="ic-gate__icon"><svg aria-hidden="true"><use href="#ic-i-lock"></use></svg></div>
    <h1>Acesso exclusivo <span class="ic-gate-break">pelo aplicativo</span></h1>
    <p>Esta central protege informações pessoais <span class="ic-gate-break">e funciona somente dentro do Turbo Tiger.</span></p>
  </main>

  <div class="ic-app" id="icApp" hidden>
    <div id="icPullRefreshIndicator" class="ic-pull-refresh" aria-hidden="true">
      <svg><use href="#ic-i-refresh"></use></svg>
    </div>
    <header class="ic-header">
      <div class="ic-header__main">
        <div class="ic-header__identity">
          <img src="../assets/icone-turbotiger-raio.webp" alt="" width="34" height="34">
          <div>
            <p class="ic-eyebrow" id="icGreeting">Seu controle</p>
            <h1>Inteligência de Cassino</h1>
          </div>
        </div>
        <div class="ic-header__actions">
          <button class="ic-icon-button" type="button" data-global-action="notifications" aria-label="Notificações">
            <svg aria-hidden="true"><use href="#ic-i-bell"></use></svg><span class="ic-notification-dot" id="icNotificationDot" hidden></span>
          </button>
          <button class="ic-icon-button" type="button" data-route="coach" aria-label="Abrir Tiger Coach">
            <svg aria-hidden="true"><use href="#ic-i-coach"></use></svg>
          </button>
          <button class="ic-icon-button" type="button" data-global-action="close" aria-label="Fechar central">
            <svg aria-hidden="true"><use href="#ic-i-close"></use></svg>
          </button>
        </div>
      </div>
      <div class="ic-status-strip" aria-label="Estado atual">
        <button class="ic-status-pill" type="button" data-route="ao-vivo" id="icCaptureStatus">
          <span class="ic-status-dot ic-status-dot--neutral"></span><span>Captura verificando</span>
        </button>
        <button class="ic-status-pill" type="button" data-route="ao-vivo" id="icGlobalSessionStatus">
          <svg aria-hidden="true"><use href="#ic-i-live"></use></svg><span>Nenhuma sessão ativa</span>
        </button>
        <span class="ic-updated" id="icLastUpdated">Ainda não sincronizado</span>
      </div>
    </header>

      <button role="tab" id="ic-tab-visao-geral" aria-controls="ic-panel-visao-geral" aria-selected="true" tabindex="0" data-section="visao-geral"><svg aria-hidden="true"><use href="#ic-i-home"></use></svg><span>Visão Geral</span></button>

      <button role="tab" id="ic-tab-historico" aria-controls="ic-panel-historico" aria-selected="false" tabindex="-1" data-section="historico"><svg aria-hidden="true"><use href="#ic-i-history"></use></svg><span>Meu Histórico</span></button>

      <button role="tab" id="ic-tab-comunidade" aria-controls="ic-panel-comunidade" aria-selected="false" tabindex="-1" data-section="comunidade"><svg aria-hidden="true"><use href="#ic-i-community"></use></svg><span>Comunidade</span></button>
      <button role="tab" id="ic-tab-regras-pausas" aria-controls="ic-panel-regras-pausas" aria-selected="false" tabindex="-1" data-section="regras-pausas"><svg aria-hidden="true"><use href="#ic-i-shield"></use></svg><span>Regras e Pausas</span></button>
      <button role="tab" id="ic-tab-coach" aria-controls="ic-panel-coach" aria-selected="false" tabindex="-1" data-section="coach"><svg aria-hidden="true"><use href="#ic-i-coach"></use></svg><span>Tiger Coach</span></button>
      <button role="tab" id="ic-tab-configuracoes" aria-controls="ic-panel-configuracoes" aria-selected="false" tabindex="-1" data-section="configuracoes"><svg aria-hidden="true"><use href="#ic-i-settings"></use></svg><span>Configurações</span></button>
    </nav>

      <section role="tabpanel" id="ic-panel-regras-pausas" aria-labelledby="ic-tab-regras-pausas" data-panel="regras-pausas" hidden></section>
      <section role="tabpanel" id="ic-panel-coach" aria-labelledby="ic-tab-coach" data-panel="coach" hidden></section>
      <section role="tabpanel" id="ic-panel-configuracoes" aria-labelledby="ic-tab-configuracoes" data-panel="configuracoes" hidden></section>
    </div>
